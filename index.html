<!DOCTYPE html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>엠마오 원어대조성경</title>
<meta name="description" content="개역한글·KJV와 히브리어(BHS)·헬라어(SBLGNT) 원문을 절 단위로 대조합니다. 원어 단어를 누르면 스트롱번호·품사·뜻과 성경 전체 용례를 볼 수 있습니다.">
<style>
:root{--ink:#20243a;--ink2:#3a3f57;--vellum:#f5efe1;--vellum2:#efe7d4;--gold:#9c7a1e;--gold-lite:#c6a548;--muted:#7a7161;--line:#ddd2b8;--card:#1c2036;--card-ink:#ece3cf;--pending:#b9a98a}
*{box-sizing:border-box;margin:0;padding:0}html{-webkit-text-size-adjust:100%}
body{background:var(--vellum);color:var(--ink);font-family:"Nanum Myeongjo","Apple SD Gothic Neo",Georgia,serif;line-height:1.6;overflow-x:hidden}
.wrap{max-width:840px;margin:0 auto;padding:0 20px 120px}
header{position:sticky;top:0;z-index:20;background:var(--ink);color:var(--vellum);border-bottom:2px solid var(--gold)}
.hbar{max-width:840px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.1}.brand b{font-size:22px;letter-spacing:.12em}.brand b i{color:var(--gold-lite);font-style:normal}
.brand span{font-size:11px;letter-spacing:.28em;color:#b9b09a;text-transform:uppercase;margin-top:3px}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;border:1px solid #4a4f6a;border-radius:2px;overflow:hidden}
.tabs button{background:transparent;color:#b9b09a;border:0;padding:7px 14px;font-family:inherit;font-size:14px;cursor:pointer}
.tabs button.on{background:var(--gold);color:var(--ink);font-weight:700}
select{background:var(--ink2);color:var(--vellum);border:1px solid #4a4f6a;border-radius:2px;padding:7px 10px;font-family:inherit;font-size:14px;cursor:pointer}
select.book{min-width:118px}select.chap{min-width:76px}
.chap{padding:34px 0 8px;text-align:center;border-bottom:1px solid var(--line);margin-bottom:4px}
.chap .bk{font-size:13px;letter-spacing:.28em;color:var(--gold)}.chap h1{font-size:32px;margin:6px 0 4px}
.chap .sub{font-size:13px;color:var(--muted)}
.cov{display:inline-block;margin-top:12px;font-size:12px;color:var(--muted);background:var(--vellum2);border:1px solid var(--line);border-radius:20px;padding:5px 14px}
.cov b{color:var(--gold);font-weight:700}
.verse{padding:18px 0;border-bottom:1px solid var(--line)}
.vnum{display:inline-block;min-width:26px;color:var(--gold);font-weight:700;font-size:14px;vertical-align:top;font-family:ui-monospace,monospace}
.kor{font-size:19px;line-height:1.75;display:inline}.kor.na{color:var(--pending);font-style:italic;font-size:15px}
.kjv{font-family:Georgia,serif;font-style:italic;color:var(--muted);font-size:14px;margin:8px 0 14px 26px;line-height:1.5}
.heb-row{direction:rtl;text-align:right;display:flex;flex-wrap:wrap;gap:5px;margin-left:26px;padding:12px 14px;background:var(--vellum2);border-radius:4px;border:1px solid var(--line)}
.chip{direction:rtl;background:transparent;border:0;cursor:pointer;padding:6px 8px 4px;border-radius:3px;text-align:center;min-width:40px;border-bottom:2px solid transparent;transition:background .15s,border-color .15s;font-family:inherit}
.chip:hover,.chip:focus{background:#fff;border-bottom-color:var(--gold);outline:none}.chip.pend{opacity:.72}
.chip .h{display:block;font-size:18px;line-height:1.35;color:var(--ink);font-family:"SBL Hebrew","Frank Ruhl Libre","Times New Roman",serif}
/* 신약(헬라어)은 좌횡서라 방향과 정렬을 뒤집는다 */
.heb-row.grk{direction:ltr;text-align:left}
.heb-row.grk .chip{direction:ltr}
.chip .t{display:block;font-size:10px;color:var(--muted);direction:ltr;font-family:Georgia,serif;font-style:italic;margin-top:1px}
.chip .g{display:block;font-size:12px;color:var(--gold);margin-top:2px;font-weight:700}.chip.pend .g{color:var(--pending);font-weight:400}
.loading{text-align:center;padding:60px 20px;color:var(--muted)}
.loading .big{font-size:36px;color:var(--gold-lite);font-family:"SBL Greek","Gentium Plus","SBL Hebrew",serif;letter-spacing:.02em;margin-bottom:12px;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.4}}
.scrim{position:fixed;inset:0;background:rgba(20,20,30,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:30}.scrim.on{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:0;height:100%;width:430px;max-width:92vw;background:var(--card);color:var(--card-ink);z-index:40;transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);box-shadow:-12px 0 40px rgba(0,0,0,.3);display:flex;flex-direction:column}.panel.on{transform:translateX(0)}
.panel .top{padding:22px 24px 18px;border-bottom:1px solid #363b57;position:relative}
.panel .close{position:absolute;top:16px;right:18px;background:0;border:0;color:#8b91ad;font-size:26px;cursor:pointer}
.panel .heb{font-size:34px;color:var(--gold-lite);line-height:1.25;font-family:"SBL Hebrew","Frank Ruhl Libre",serif;direction:rtl}
.panel .heb.grk{direction:ltr;font-family:"SBL Greek","Gentium Plus","Times New Roman",serif}
.panel .translit{font-family:Georgia,serif;font-style:italic;color:#b7bdd6;font-size:16px;margin-top:4px}
.panel .strong{display:inline-block;margin-top:10px;font-family:ui-monospace,monospace;font-size:13px;color:var(--ink);background:var(--gold-lite);padding:2px 9px;border-radius:2px}
.panel .body{padding:20px 24px;overflow-y:auto;flex:1}
.row{margin-bottom:18px}.row .lab{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#8b91ad;margin-bottom:5px}
.row .val{font-size:16px}.row .val.big{font-size:22px;font-weight:700;color:#fff}.row .def{font-size:14px;line-height:1.6;color:#d4d9ec;font-family:Georgia,serif}
.pendbox{font-size:14px;color:#c3c9e0;padding:12px 14px;background:#232842;border-radius:4px;border-left:3px solid var(--gold)}.pendbox b{color:var(--gold-lite)}
.panel .foot{padding:14px 24px;border-top:1px solid #363b57;font-size:11px;color:#6f7590;line-height:1.5}
.hint{text-align:center;color:var(--muted);font-size:13px;padding:18px 0 0}
.occsum{font-size:13px;color:#b7bdd6;margin-bottom:10px}.occsum b{color:var(--gold-lite)}
.bchips{display:flex;flex-wrap:wrap;gap:6px}
.bchip{background:#232842;color:#c3c9e0;border:1px solid #363b57;border-radius:3px;padding:5px 9px;font-size:12px;font-family:inherit;cursor:pointer}
.bchip:hover{border-color:var(--gold-lite);color:#fff}
.bchip.on{background:var(--gold-lite);color:var(--ink);border-color:var(--gold-lite);font-weight:700}
.bchip b{color:var(--gold-lite);margin-left:5px}.bchip.on b{color:var(--ink)}
.occlist{margin-top:12px;border-top:1px solid #363b57}
.occitem{display:block;width:100%;text-align:left;background:0;border:0;border-bottom:1px solid #2b3049;color:#d4d9ec;padding:9px 2px;font-family:inherit;font-size:13px;cursor:pointer;line-height:1.5}
.occitem:hover{background:#232842}
.occitem .ref{color:var(--gold-lite);font-family:ui-monospace,monospace;font-size:12px;font-weight:700;margin-right:8px}
.occitem .txt{color:#aeb5cf}.occitem.cur{background:#2a3050}.occitem.cur .ref{color:#fff}
.occmore{width:100%;background:#232842;border:1px dashed #454b6b;color:#8b91ad;padding:7px;font-family:inherit;font-size:12px;cursor:pointer;margin-top:8px;border-radius:3px}
.occmore:hover{color:var(--gold-lite);border-color:var(--gold-lite)}
.occload{font-size:13px;color:#8b91ad;padding:8px 0}
.aibox{margin-top:14px;background:#232842;border:1px solid #3b4166;border-left:3px solid var(--gold);border-radius:4px;padding:13px 15px}
.aihd{font-size:12px;color:var(--gold-lite);font-weight:700;margin-bottom:8px;line-height:1.5}
.aihd .tag{display:inline-block;font-size:10px;font-weight:400;color:#8b91ad;border:1px solid #454b6b;border-radius:2px;padding:1px 5px;margin-left:6px;vertical-align:1px}
.aitxt{font-size:13.5px;line-height:1.8;color:#e4e8f7;white-space:pre-wrap}
.aifoot{margin-top:11px;padding-top:9px;border-top:1px solid #363b57;font-size:11px;color:#7d8399;line-height:1.5}
.aigen{margin-top:10px;background:#2a3050;border:1px solid #454b6b;color:#c3c9e0;font-family:inherit;font-size:12.5px;padding:7px 12px;border-radius:3px;cursor:pointer}
.aigen:hover:not([disabled]){border-color:var(--gold-lite);color:var(--gold-lite)}
.aigen[disabled]{opacity:.55;cursor:default}
.aierr{font-size:12px;color:var(--pending);margin-top:8px;line-height:1.5}
.kodef{font-size:14px;line-height:1.75;color:#e4e8f7}
.endef{font-size:13px;line-height:1.6;color:#aeb5cf;font-family:Georgia,serif;margin-top:8px}
.cutmark{color:var(--pending);font-size:11px;font-style:italic;white-space:nowrap}
.srclab{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#7d8399;margin-top:12px}
.srclab:first-child{margin-top:0}
.srclab+.endef{margin-top:3px}
.minibtn{display:inline-block;margin-top:9px;background:#232842;border:1px solid #454b6b;color:#b7bdd6;font-family:inherit;font-size:12px;padding:5px 10px;border-radius:3px;cursor:pointer;text-decoration:none}
.minibtn:hover{border-color:var(--gold-lite);color:var(--gold-lite)}
.verse.hl{background:#fff6d8;box-shadow:0 0 0 8px #fff6d8;border-radius:2px;transition:background 1s,box-shadow 1s}
.chip.hl{background:#ffeaa0;border-bottom-color:var(--gold)}
@media(max-width:560px){.panel{width:100%;max-width:100%;top:auto;bottom:0;height:82%;transform:translateY(100%);border-radius:14px 14px 0 0}.panel.on{transform:translateY(0)}.chap h1{font-size:26px}.kor{font-size:18px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<header><div class="hbar">
<div class="brand"><b>Ἐ <i>엠마오</i></b><span>Emmaus · 원어대조성경 (신구약)</span></div>
<div class="controls"><div class="tabs"><button class="on" id="tab-ot">구약</button><button id="tab-nt">신약</button></div>
<select id="book" class="book"></select><select id="chap" class="chap"></select></div></div></header>
<div class="wrap">
<div class="chap"><div class="bk" id="c-bk"></div><h1 id="c-title"></h1><div class="sub" id="c-sub"></div><div class="cov" id="c-cov"></div></div>
<div id="text"><div class="loading"><div class="big">Ἐμμαοῦς</div>불러오는 중…</div></div>
<div class="hint">↑ 원어 단어를 누르면 뜻 · 품사와 함께 <b>그 단어가 쓰인 성경의 모든 구절</b>이 열립니다 (구절을 누르면 이동)</div>
</div>
<div class="scrim" id="scrim"></div>
<aside class="panel" id="panel"><div class="top"><button class="close" id="close">×</button><div class="heb" id="p-heb"></div><div class="translit" id="p-translit"></div><div><span class="strong" id="p-strong"></span></div></div>
<div class="body"><div class="row"><div class="lab">뜻</div><div class="val big" id="p-gloss"></div></div>
<div class="row"><div class="lab">품사 (문맥 형태)</div><div class="val" id="p-morph"></div></div>
<div class="row"><div class="lab" id="p-deflab">상세 정의 (영문)</div><div class="def" id="p-def"></div></div>
<div class="row"><div class="lab">성경 내 용례</div><div id="p-occ"></div></div></div>
<div class="foot" id="p-foot"></div></aside>
<script>
let LEX={}, MANI=[], CUR=null, curBi=0, curTest='ot';
const bookSel=document.getElementById('book'),chapSel=document.getElementById('chap'),text=document.getElementById('text');
/* 용례(콘코던스) 상태 */
const IDX={},BOOKCACHE=new Map(),MAXCACHE=4;
let OCC=null,occToken=0;
/* ── AI 요약 설정 ──────────────────────────────
   SUMAPI: 실시간 요약 서버(Cloudflare Worker) 주소.
   비워 두면 books/_sum.json에 내장된 요약만 표시하고, 생성 버튼은 숨겨진다.
   server/README.md 의 배포 절차를 마친 뒤 발급받은 주소를 여기에 넣으면 켜진다.
   커밋하기 전에 시험해 보려면 개발자 도구 콘솔에서 아래처럼 덮어쓸 수 있다.
     localStorage.setItem('miqra.sumapi','https://…workers.dev'); location.reload(); */
let SUMAPI='';
try{SUMAPI=localStorage.getItem('miqra.sumapi')||SUMAPI;}catch(e){}
const SUM_DISC='요약한 내용은 AI의 결과로 정리된 것입니다. 성경 연구의 참고 자료로만 활용해 주세요.';
let SUM={};
const sumKey=(s,bi)=>s+'|'+bi;
function sumCacheGet(k){try{return localStorage.getItem('miqra.sum.'+k);}catch(e){return null;}}
function sumCacheSet(k,v){try{localStorage.setItem('miqra.sum.'+k,v);}catch(e){}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function getBook(bi){
  if(BOOKCACHE.has(bi)){const b=BOOKCACHE.get(bi);BOOKCACHE.delete(bi);BOOKCACHE.set(bi,b);return b;}
  const b=await (await fetch('books/'+MANI[bi].osis+'.json')).json();
  BOOKCACHE.set(bi,b);
  while(BOOKCACHE.size>MAXCACHE){
    let victim=null;
    for(const k of BOOKCACHE.keys()){if(k!==curBi&&k!==bi){victim=k;break;}}
    if(victim===null)break;
    BOOKCACHE.delete(victim);
  }
  return b;
}
async function getIdx(s){
  const shard=s.slice(0,3);
  if(!(shard in IDX)){
    try{IDX[shard]=await (await fetch('books/idx/'+shard+'.json')).json();}
    catch(e){IDX[shard]={};}
  }
  return IDX[shard][s]||null;
}
/* "0:1.1,1.26|2:3.4" -> [[책인덱스,[[장,절],...]],...] */
function parseRefs(r){
  return r.split('|').map(p=>{const k=p.indexOf(':');
    return [+p.slice(0,k),p.slice(k+1).split(',').map(x=>x.split('.'))];});
}
function fillBooks(){
  bookSel.innerHTML='';
  MANI.forEach((b,i)=>{if((b.t||'ot')!==curTest)return;const o=document.createElement('option');o.value=i;o.textContent=b.name;bookSel.appendChild(o);});
}
async function switchTest(t){
  if(curTest===t)return; curTest=t;
  document.getElementById('tab-ot').classList.toggle('on',t==='ot');
  document.getElementById('tab-nt').classList.toggle('on',t==='nt');
  fillBooks();
  await loadBook(+bookSel.value);
}
async function boot(){
  try{
    MANI=await (await fetch('books/_manifest.json')).json();
    LEX=await (await fetch('books/_lex.json')).json();
    try{SUM=await (await fetch('books/_sum.json')).json();}catch(e){SUM={};}
    fillBooks();
    document.getElementById('tab-ot').onclick=()=>switchTest('ot');
    document.getElementById('tab-nt').onclick=()=>switchTest('nt');
    await loadBook(+bookSel.value);
  }catch(e){text.innerHTML='<div class="loading">데이터를 불러오지 못했습니다. 서버(정적 호스팅)에서 실행해야 합니다.<br><span style="font-size:12px">'+e+'</span></div>';}
}
async function loadBook(bi,ch,hlV,hlS){
  curBi=bi;const m=MANI[bi];
  text.innerHTML='<div class="loading"><div class="big">Ἐμμαοῦς</div>'+m.name+' 불러오는 중…</div>';
  CUR=await getBook(bi);
  chapSel.innerHTML='';for(let c=1;c<=CUR.chapters;c++){const o=document.createElement('option');o.value=c;o.textContent=c+'장';chapSel.appendChild(o);}
  const target=Math.min(Math.max(+(ch||1),1),CUR.chapters);
  chapSel.value=target;
  render(target,hlV,hlS);
}
function render(ch,hlV,hlS){
  const m=MANI[curBi],C=String(ch);
  document.getElementById('c-bk').textContent=CUR.osis.toUpperCase();
  document.getElementById('c-title').textContent=m.name+' '+ch+'장';
  document.getElementById('c-sub').textContent='개역한글 · KJV · '+(curTest==='nt'?'헬라어 원문(SBLGNT)':'히브리어 원문(BHS)');
  const kor=CUR.kor[C]||{},kjv=CUR.kjv[C]||{},heb=CUR.heb[C]||{};
  let tot=0,cov=0;Object.values(heb).forEach(ws=>ws.forEach(w=>{tot++;if((LEX[w.s]||{}).ko)cov++;}));
  const korMiss=!CUR.kor[C];
  document.getElementById('c-cov').innerHTML=`한국어 gloss 커버 <b>${tot?Math.round(cov/tot*100):0}%</b>`+(korMiss?' · 개역한글 준비 중':'');
  text.innerHTML='';
  const verses=korMiss?Object.keys(heb):Object.keys(kor);
  verses.forEach(v=>{
    const words=heb[v]||[];
    const chips=words.map((w,i)=>{const L=LEX[w.s]||{};const pend=!L.ko;
      const hit=(hlS&&w.s===hlS)?' hl':'';
      return `<button class="chip${pend?' pend':''}${hit}" data-v="${v}" data-i="${i}"><span class="h">${w.h}</span><span class="t">${L.t||''}</span><span class="g">${L.ko||'·'}</span></button>`;}).join('');
    const korLine=kor[v]!=null?`<span class="kor">${kor[v]}</span>`:`<span class="kor na">개역한글 준비 중 (소스 보완 필요)</span>`;
    text.insertAdjacentHTML('beforeend',`<div class="verse" id="v-${v}"><span class="vnum">${v}</span>${korLine}<div class="kjv">${kjv[v]||''}</div>${words.length?`<div class="heb-row${curTest==='nt'?' grk':''}">${chips}</div>`:''}</div>`);
  });
  if(hlV!=null)spotlight(hlV);
}
function spotlight(v){
  const el=document.getElementById('v-'+v);if(!el)return;
  el.classList.add('hl');
  window.scrollTo({top:el.getBoundingClientRect().top+window.pageYOffset-110,behavior:'smooth'});
  setTimeout(()=>el.classList.remove('hl'),2800);
}
const panel=document.getElementById('panel'),scrim=document.getElementById('scrim');
function openWord(ch,v,i){const w=CUR.heb[String(ch)][v][i],L=LEX[w.s]||{};
  const pheb=document.getElementById('p-heb');
  pheb.textContent=w.h;
  /* 헬라어(G####)면 좌횡서로 */
  pheb.classList.toggle('grk',w.s.charAt(0)==='G');
  document.getElementById('p-translit').textContent=L.t||'';
  document.getElementById('p-strong').textContent=w.s;document.getElementById('p-gloss').textContent=L.ko||'번역 준비 중';
  document.getElementById('p-morph').textContent=w.m||'—';
  const def=document.getElementById('p-def');
  /* 사전이 둘이다. d = 구약 BDB(1906) / 신약 Abbott-Smith, sd = 스트롱 히브리어사전.
     둘 다 퍼블릭도메인이라 나란히 실어도 된다. */
  const main=(L.d||L.ge||'').trim(), sub=(L.sd||'').trim();
  const src=w.s.charAt(0)==='G'?'Abbott-Smith':'BDB';
  const en=sub&&sub!==main?`${main}\n\n[스트롱 사전] ${sub}`:main;
  const enBlock=()=>
     (main?`<div class="srclab">${src}</div><div class="endef">${esc(main)}</div>`:'')
    +(sub&&sub!==main?`<div class="srclab">스트롱 사전</div><div class="endef">${esc(sub)}</div>`:'')
    ||'<div class="endef">—</div>';
  const parts=[];
  if(L.kd){
    parts.push(`<div class="kodef">${esc(L.kd)}</div>`);
    parts.push(`<button class="minibtn" data-act="en">영문 원문 ▾</button>`);
    parts.push(`<div id="p-en" style="display:none">${enBlock()}</div>`);
  }else{
    parts.push(enBlock());
    if(main)parts.push(`<a class="minibtn" target="_blank" rel="noopener" href="https://translate.google.com/?sl=en&tl=ko&op=translate&text=${encodeURIComponent(en)}">Google 번역으로 보기 ↗</a>`);
  }
  def.innerHTML=parts.join('');
  document.getElementById('p-deflab').textContent=L.kd?'상세 정의':'상세 정의 (영문)';
  document.getElementById('p-foot').innerHTML=(w.s.charAt(0)==='G'
    ?'원문 SBLGNT · 태깅 STEPBible TAGNT (CC BY 4.0)<br>상세정의 Abbott-Smith(1922, PD)'
    :'원문 BHS/OSHB · 태깅 STEPBible (CC BY 4.0)<br>상세정의 BDB(1906, PD) · 스트롱 히브리어사전(1890, PD)<br>OSHB Hebrew Lexicon (CC BY 4.0)')
    +'<br>개역한글(PD) · KJV(PD)';
  renderOcc(w.s);
  panel.querySelector('.body').scrollTop=0;
  panel.classList.add('on');scrim.classList.add('on');}
/* ── 성경 내 용례 ───────────────────────────── */
async function renderOcc(s){
  const box=document.getElementById('p-occ');
  const my=++occToken;OCC=null;
  if(!s){box.innerHTML='<div class="occload">스트롱번호가 없어 용례를 찾을 수 없습니다.</div>';return;}
  box.innerHTML='<div class="occload">용례 찾는 중…</div>';
  const e=await getIdx(s);
  if(my!==occToken)return;
  if(!e){box.innerHTML='<div class="occload">색인에서 찾지 못했습니다.</div>';return;}
  const groups=parseRefs(e.r);
  const nv=groups.reduce((a,g)=>a+g[1].length,0);
  const sorted=[...groups].sort((a,b)=>b[1].length-a[1].length);
  OCC={s:s,map:new Map(groups)};
  box.innerHTML=`<div class="occsum">총 <b>${e.n.toLocaleString()}</b>회 · <b>${nv.toLocaleString()}</b>개 구절 · <b>${groups.length}</b>권</div>`
    +`<div class="bchips">${sorted.map(g=>`<button class="bchip" data-bi="${g[0]}">${esc(MANI[g[0]].name)}<b>${g[1].length}</b></button>`).join('')}</div>`
    +`<div id="p-sum"></div>`
    +`<div class="occlist" id="p-occlist"></div>`;
  expandBook(OCC.map.has(curBi)?curBi:sorted[0][0]);
}
async function expandBook(bi,showAll){
  if(!OCC)return;
  const my=occToken,LIMIT=40;
  document.querySelectorAll('#p-occ .bchip').forEach(c=>c.classList.toggle('on',+c.dataset.bi===bi));
  renderSum(bi);
  const list=document.getElementById('p-occlist');
  list.innerHTML='<div class="occload">본문 불러오는 중…</div>';
  const refs=OCC.map.get(bi)||[];
  const b=await getBook(bi);
  if(my!==occToken)return;
  const show=showAll?refs:refs.slice(0,LIMIT);
  const rows=show.map(([ch,v])=>{
    const raw=((b.kor||{})[ch]||{})[v]||((b.kjv||{})[ch]||{})[v]||'';
    const t=raw.length>78?raw.slice(0,78)+'…':raw;
    const cur=(bi===curBi&&String(ch)===String(chapSel.value))?' cur':'';
    return `<button class="occitem${cur}" data-bi="${bi}" data-ch="${ch}" data-v="${v}"><span class="ref">${ch}:${v}</span><span class="txt">${esc(t)}</span></button>`;
  }).join('');
  list.innerHTML=`<div class="occsum" style="margin:12px 0 4px">${esc(MANI[bi].name)} · ${refs.length}개 구절</div>`+rows
    +(show.length<refs.length?`<button class="occmore" data-bi="${bi}">나머지 ${refs.length-show.length}개 더 보기</button>`:'');
}
/* ── AI 요약 박스 ───────────────────────────── */
function sumLabel(s){
  const L=LEX[s]||{},w=document.getElementById('p-heb').textContent.trim();
  return `‘${L.ko||s}’${w?`(${w})`:''}`;
}
function sumBox(title,body,tag,btnBi,btnLabel){
  return `<div class="aibox">`
    +`<div class="aihd">${esc(title)}${tag?`<span class="tag">${esc(tag)}</span>`:''}</div>`
    +(body?`<div class="aitxt">${esc(body)}</div>`:'')
    +(btnBi!=null?`<button class="aigen" data-bi="${btnBi}">${esc(btnLabel)}</button>`:'')
    +`<div class="aifoot">${SUM_DISC}</div></div>`;
}
function renderSum(bi){
  const host=document.getElementById('p-sum');
  if(!host||!OCC)return;
  OCC.bi=bi;
  const s=OCC.s,k=sumKey(s,bi),bn=MANI[bi].name,lab=sumLabel(s);
  const book=SUM[k]||sumCacheGet(k);
  if(book){host.innerHTML=sumBox(`${bn}에서 사용된 ${lab}의 의미`,book,SUM[k]?'내장 요약':'생성된 요약');return;}
  const whole=SUM[s]||null;
  if(!whole&&!SUMAPI){host.innerHTML='';return;}
  host.innerHTML=sumBox(
    whole?`성경 전체에서 사용된 ${lab}의 의미`:`${bn}에서 사용된 ${lab}의 의미`,
    whole,whole?'내장 요약':null,
    SUMAPI?bi:null,
    whole?`${bn}에서의 의미로 좁혀서 요약하기`:'AI 요약 생성하기');
}
async function genSum(bi){
  const host=document.getElementById('p-sum'),btn=host&&host.querySelector('.aigen');
  if(!OCC||!btn||!SUMAPI)return;
  const s=OCC.s,my=occToken,k=sumKey(s,bi);
  btn.disabled=true;btn.textContent='요약을 만드는 중…';
  const old=host.querySelector('.aierr');if(old)old.remove();
  try{
    const b=await getBook(bi);
    const verses=(OCC.map.get(bi)||[]).slice(0,60).map(([ch,v])=>
      ({ref:ch+':'+v,text:(((b.kor||{})[ch]||{})[v])||(((b.kjv||{})[ch]||{})[v])||''}));
    const L=LEX[s]||{};
    const r=await fetch(SUMAPI,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      strong:s,lemma:document.getElementById('p-heb').textContent,translit:L.t||'',
      gloss:L.ko||'',definition:L.kd||L.d||L.ge||'',
      book:MANI[bi].name,total:(OCC.map.get(bi)||[]).length,verses})});
    if(!r.ok)throw new Error('서버 응답 '+r.status);
    const j=await r.json();
    if(!j.summary)throw new Error(j.error||'빈 응답');
    sumCacheSet(k,j.summary);
    if(my===occToken&&OCC&&OCC.s===s&&OCC.bi===bi)renderSum(bi);
  }catch(e){
    if(my!==occToken)return;
    btn.disabled=false;btn.textContent='다시 시도';
    const er=document.createElement('div');er.className='aierr';
    er.textContent='요약을 만들지 못했습니다 · '+e.message;
    const box=host.querySelector('.aibox'),foot=host.querySelector('.aifoot');
    if(box&&foot)box.insertBefore(er,foot);
  }
}
async function gotoRef(bi,ch,v){
  const s=OCC?OCC.s:null;
  close();
  const t=MANI[bi].t||'ot';
  if(t!==curTest){
    curTest=t;
    document.getElementById('tab-ot').classList.toggle('on',t==='ot');
    document.getElementById('tab-nt').classList.toggle('on',t==='nt');
    fillBooks();
  }
  bookSel.value=bi;
  if(bi!==curBi){await loadBook(bi,ch,v,s);}
  else{chapSel.value=ch;render(+ch,v,s);}
}
function close(){panel.classList.remove('on');scrim.classList.remove('on');}
text.addEventListener('click',e=>{const c=e.target.closest('.chip');if(c)openWord(chapSel.value,c.dataset.v,+c.dataset.i);});
document.getElementById('p-def').addEventListener('click',e=>{
  const b=e.target.closest('[data-act="en"]');if(!b)return;
  const box=document.getElementById('p-en');if(!box)return;
  const open=box.style.display!=='none';
  box.style.display=open?'none':'block';
  b.textContent=open?'영문 원문 ▾':'영문 원문 ▴';
});
document.getElementById('p-occ').addEventListener('click',e=>{
  const ag=e.target.closest('.aigen');if(ag){genSum(+ag.dataset.bi);return;}
  const bc=e.target.closest('.bchip');if(bc){expandBook(+bc.dataset.bi);return;}
  const mo=e.target.closest('.occmore');if(mo){expandBook(+mo.dataset.bi,true);return;}
  const it=e.target.closest('.occitem');if(it){gotoRef(+it.dataset.bi,it.dataset.ch,it.dataset.v);}
});
document.getElementById('close').onclick=close;scrim.onclick=close;document.addEventListener('keydown',e=>{if(e.key==='Escape')close();});
bookSel.addEventListener('change',e=>loadBook(+e.target.value));
chapSel.addEventListener('change',e=>render(+e.target.value));
boot();
</script></body></html>
