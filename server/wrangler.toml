name = "miqra-sum"
main = "worker.js"
compatibility_date = "2025-01-01"

[vars]
# 요약 요청을 허용할 도메인. 여러 개면 쉼표로 구분한다.
# 로컬에서 시험할 때는 "http://localhost:8765" 를 함께 넣어 둔다.
ALLOWED_ORIGINS = "https://emmaustransbible.co.kr,https://www.emmaustransbible.co.kr,https://mongsildaddy.github.io,http://localhost:8765,http://127.0.0.1:8765"

# 사용할 모델. 비워 두면 worker.js의 기본값을 쓴다.
MODEL = "claude-sonnet-5"

# Anthropic 호출 경로. Cloudflare AI Gateway 를 거친다.
# api.anthropic.com 으로 직접 나가면 Workers 의 나가는 IP 일부가 403 으로 막히고,
# 그 차단이 워커 인스턴스에 고정이라 재시도로도 뚫리지 않는다.
# (실측: 직접 호출은 3라운드 중 2라운드가 8/8 실패, 게이트웨이는 24/24 성공)
# 문제가 생기면 이 줄만 지우면 직접 호출로 되돌아간다.
ANTHROPIC_URL = "https://gateway.ai.cloudflare.com/v1/ee391c04474e3d92ff91d99b2ddf3776/emmaus/anthropic/v1/messages"

# 결과 캐시. 같은 요청은 최초 1회만 과금되고 그 뒤로는 KV에서 바로 나온다.
#   wrangler kv namespace create SUMCACHE
[[kv_namespaces]]
binding = "SUMCACHE"
id = "4a8a33bdba194ae99e435de24a2abd23"

# 순간 폭주 차단. IP 하나가 60초에 30번을 넘기면 429로 끊는다.
# namespace_id 는 계정 안에서 이 제한을 구분하는 임의의 숫자다.
[[ratelimits]]
name = "RL"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 30
  period = 60
